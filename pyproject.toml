[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phreeqpyne"
version = "0.1.0"
description = "Project-level PhreeqPy application scaffold for CFAS hydrothermal transport simulations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "PhreeqPyne contributors" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "phreeqpy>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.7"]

[project.scripts]
phreeqpyne = "phreeqpyne.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
